# Termux UI tuned for a Fold plus occasional hardware keyboard.
enforce-char-based-input = true
back-key = escape
use-black-ui = true
terminal-margin-horizontal = 1
terminal-margin-vertical = 0
bell-character = ignore
shortcut.create-session = ctrl + t
shortcut.rename-session = ctrl + n
extra-keys = [ \
  ['|', '/', '-', '_', 'HOME', 'UP', 'END', 'PGUP'], \
  ['ESC', 'TAB', 'CTRL', 'ALT', 'LEFT', 'DOWN', 'RIGHT', 'PGDN'] \
]
